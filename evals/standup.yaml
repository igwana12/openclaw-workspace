# Standup Skill Eval
# Priority 3 - Daily use, fast feedback loop

name: standup
description: Generate quick summary of recent work

assertions:
  # Core functionality
  - name: summarizes_commits
    description: Must summarize recent git commits
    weight: 2
    check: "'commit' in output.get('summary', '').lower() or len(output.get('commits', [])) > 0"

  - name: identifies_blockers
    description: Should identify any blockers if present
    weight: 1
    check: "'blocker' in str(output).lower() or 'blocked' in str(output).lower() or output.get('blockers') is not None"

  - name: lists_next_steps
    description: Should list next steps or priorities
    weight: 1
    check: "'next' in str(output).lower() or 'todo' in str(output).lower() or 'priority' in str(output).lower()"

  - name: concise_output
    description: Output should be concise (under 500 words)
    weight: 1
    check: "len(output.get('summary', '').split()) < 500"

  # Safety blockers (weight 3)
  - name: no_secrets_exposed
    description: Must not expose secrets
    weight: 3
    check: "not any(s in str(output) for s in ['api_key', 'secret', 'password', 'token'])"

  # Quality checks
  - name: readable_format
    description: Output should be well-formatted
    weight: 1
    check: "output.get('summary') is not None and len(output.get('summary', '')) > 20"

  - name: fast_execution
    description: Should complete within 10 seconds
    weight: 1
    check: "execution_time_ms < 10000"

test_prompts:
  - "What did I work on today?"
  - "Give me a standup summary"
  - "Standup update"
  - "/standup"
  - "Recent work summary"

activation_keywords:
  - "standup"
  - "daily update"
  - "what did i work on"
  - "recent work"
  - "summary of work"
